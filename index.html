<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opus Maker - Criador de Música</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎵 Opus Maker</h1>
            <p>Criador de Música Digital</p>
        </header>

        <div class="main-content">
            <!-- Sequenciador de batidas -->
            <section class="sequencer">
                <h2>Sequenciador de Batidas</h2>
                <div id="beat-grid" class="beat-grid">
                    <!-- Grid será gerado dinamicamente -->
                </div>
            </section>

            <!-- Controles -->
            <section class="controls">
                <div class="control-group">
                    <button id="play-btn" class="btn btn-primary">▶️ Play</button>
                    <button id="stop-btn" class="btn btn-secondary">⏹️ Stop</button>
                    <button id="clear-btn" class="btn btn-danger">🗑️ Limpar</button>
                </div>
                
                <div class="control-group">
                    <button id="save-btn" class="btn btn-success">💾 Salvar</button>
                    <button id="load-btn" class="btn btn-info">📂 Carregar</button>
                    <select id="preset-select" class="preset-select">
                        <option value="">Carregar Preset...</option>
                        <option value="basic">🎵 Básico</option>
                        <option value="techno">🎹 Techno</option>
                        <option value="hiphop">🎤 Hip-Hop</option>
                        <option value="house">🏠 House</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <label for="tempo">Tempo (BPM):</label>
                    <input type="range" id="tempo" min="60" max="180" value="120">
                    <span id="tempo-value">120</span>
                </div>

                <div class="control-group">
                    <label for="volume">Volume:</label>
                    <input type="range" id="volume" min="0" max="100" value="70">
                    <span id="volume-value">70</span>
                </div>
            </section>

            <!-- Painel de instrumentos -->
            <section class="instruments">
                <h2>Instrumentos</h2>
                <div class="instrument-list">
                    <div class="instrument-item" data-sound="kick">
                        <span>🥁 Kick</span>
                    </div>
                    <div class="instrument-item" data-sound="snare">
                        <span>🥁 Snare</span>
                    </div>
                    <div class="instrument-item" data-sound="hihat">
                        <span>🎩 Hi-Hat</span>
                    </div>
                    <div class="instrument-item" data-sound="clap">
                        <span>👏 Clap</span>
                    </div>
                    <div class="instrument-item" data-sound="tom">
                        <span>🥁 Tom</span>
                    </div>
                    <div class="instrument-item" data-sound="cymbal">
                        <span>🥁 Cymbal</span>
                    </div>
                </div>
            </section>
        </div>

        <footer>
            <p>Opus Maker © 2026 - Projeto de Recriação do Maker</p>
        </footer>
    </div>

    <script src="js/audioEngine.js"></script>
    <script src="js/sequencer.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
